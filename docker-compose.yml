services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inveterate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    # Migrate, create the demo admin + catalog, then serve. Idempotent on restart.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py createsuperuser --noinput || true &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      REDIS_HOST: redis
      # Demo-only Fernet key for encrypted fields. GENERATE YOUR OWN for anything real:
      #   python -c "import os,base64; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
      FIELD_ENCRYPTION_KEY: S-lfkqFhHwZGIaAZYFeEJ1mB0d2Qs516_QaP31VAqBU=
      # Demo admin (override for anything real)
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build: .
    command: celery -A config worker -l INFO
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      REDIS_HOST: redis
      FIELD_ENCRYPTION_KEY: S-lfkqFhHwZGIaAZYFeEJ1mB0d2Qs516_QaP31VAqBU=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_HOST: db
      REDIS_HOST: redis
      FIELD_ENCRYPTION_KEY: S-lfkqFhHwZGIaAZYFeEJ1mB0d2Qs516_QaP31VAqBU=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  test:
    build: .
    command: python manage.py test inveterate
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
    profiles:
      - test

volumes:
  pgdata:
