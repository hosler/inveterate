[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-inveterate"
version = "1.0.0"
description = "Django app for VPS hosting — manage Proxmox VMs and containers via REST API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "hosler" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "Django>=5.2,<7",
    "djangorestframework>=3.15",
    "django-filter>=24.3",
    "celery>=5.4",
    "django-celery-beat>=2.7",
    "django-celery-results>=2.5",
    "celery-singleton>=0.3.1",
    "proxmoxer>=2.1",
    "requests>=2.32",
    "urllib3>=2.3",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
docs = [
    "drf-spectacular>=0.27",
]
cors = [
    "django-cors-headers>=4.4",
]
websocket = [
    "channels>=4.0",
    "channels-redis>=4.1",
    "daphne>=4.0",
    "websockets>=12.0",
]
all = [
    "django-inveterate[docs,cors,websocket]",
]

[project.urls]
Homepage = "https://github.com/hosler/inveterate"
Repository = "https://github.com/hosler/inveterate"

[tool.hatch.build.targets.wheel]
packages = ["inveterate"]

[tool.hatch.build.targets.sdist]
include = [
    "inveterate/",
    "LICENSE",
    "README.md",
]
